modules:
  jira:adminPage:
    - key: field-orchestrator-hello-world-admin-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: AutoUp
  trigger:
    - key: field-orchestrator-filtered-issue-create
      function: runtime
      events:
        - avi:jira:created:issue
      filter:
        ignoreSelf: true
        expression: |
          event.runtime.project.properties['field-orchestrator-runtime-v1'].active == true
        onError: IGNORE_AND_LOG
    - key: field-orchestrator-filtered-issue-update
      function: runtime
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
        expression: |
          event.runtime.project.properties['field-orchestrator-runtime-v1'].active == true
          && event.changelog.items.some(change =>
            event.runtime.project.properties['field-orchestrator-runtime-v1'].fieldIds.includes(change.fieldId)
          )
        onError: IGNORE_AND_LOG
    - key: relationship-links
      function: relationship-ingress
      events:
        - avi:jira:created:issuelink
        - avi:jira:deleted:issuelink
      filter:
        ignoreSelf: true
        expression: |
          event.runtime.project.properties['field-orchestrator-runtime-v1'].linkRoutes.includes(event.issueLinkType.id + ':' + event.destinationProjectId)
        onError: IGNORE_AND_LOG
    - key: relationship-deletion
      function: relationship-ingress
      events:
        - avi:jira:deleted:issue
      filter:
        ignoreSelf: true
        expression: |
          event.runtime.project.properties['field-orchestrator-runtime-v1'].relationship == true
        onError: IGNORE_AND_LOG
  consumer:
    - key: relationship-consumer
      queue: relationship-jobs
      function: relationship-worker
    - key: population-consumer
      queue: population-jobs
      function: population-worker
  function:
    - key: resolver
      handler: index.handler
    - key: runtime
      handler: index.handleFilteredIssueUpdate
    - key: relationship-ingress
      handler: index.enqueueRelationshipEvent
    - key: relationship-worker
      handler: index.runRelationshipJob
      timeoutSeconds: 300
    - key: population-worker
      handler: index.runPopulationJob
      timeoutSeconds: 300
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/3a1312b8-ed7b-48fc-8624-696846a634a1

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - manage:jira-project
    - storage:app
